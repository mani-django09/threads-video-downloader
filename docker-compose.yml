name: threadsdl

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* are baked into the client bundle at build time.
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://threadsdl.io}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
        NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID:-}
        NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION:-}
        NEXT_PUBLIC_ADSENSE_CLIENT_ID: ${NEXT_PUBLIC_ADSENSE_CLIENT_ID:-}
    restart: unless-stopped
    init: true # tini as PID 1 so SIGTERM reaches node (graceful shutdown)
    stop_grace_period: 20s
    # Loopback only: reachable by nginx (the bundled container, or the host's own
    # nginx on a shared server), never directly from the internet.
    ports:
      - '127.0.0.1:${APP_HOST_PORT:-3150}:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: file:/app/data/app.db
      # Refuse to start without these rather than run with the admin panel misconfigured.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?Set ADMIN_SESSION_SECRET in .env}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-20}
      FETCH_RATE_LIMIT_WINDOW_MS: ${FETCH_RATE_LIMIT_WINDOW_MS:-3600000}
      FETCH_RATE_LIMIT_MAX_REQUESTS: ${FETCH_RATE_LIMIT_MAX_REQUESTS:-25}
    volumes:
      - app_data:/app/data
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/health/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *default-logging

  # nginx + certbot are only for a dedicated server. On a server that already runs
  # nginx (shared host), leave this profile off and proxy to 127.0.0.1:APP_HOST_PORT.
  nginx:
    profiles: ['standalone']
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/nginx/threadsdl.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1/nginx-health']
      interval: 30s
      timeout: 5s
      retries: 3
    # Reload periodically so renewed certificates are picked up without a restart.
    command: >-
      /bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & exec nginx -g "daemon off;"'
    logging: *default-logging

  certbot:
    profiles: ['standalone']
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - ./deploy/certbot/conf:/etc/letsencrypt
      - ./deploy/certbot/www:/var/www/certbot
    # Checks twice a day; certbot only renews certificates within 30 days of expiry.
    entrypoint: >-
      /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'
    logging: *default-logging

volumes:
  app_data:
