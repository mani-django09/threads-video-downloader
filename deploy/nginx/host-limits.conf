# Rate-limit zones for threadsdl.io. Install as /etc/nginx/conf.d/threadsdl-limits.conf
# (conf.d is included inside http {}). Zone names are prefixed so they cannot
# collide with the other sites' zones.
limit_req_zone $binary_remote_addr zone=threadsdl_resolve:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=threadsdl_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=threadsdl_general:10m rate=20r/s;
