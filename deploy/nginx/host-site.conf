# threadsdl.io on a server that already runs nginx + certbot for other sites.
# Install as /etc/nginx/sites-enabled/threadsdl.io (same layout as the other sites).
# The app container listens on 127.0.0.1:3150 (APP_HOST_PORT in .env).
#
# The certificate is issued first with:  certbot certonly --nginx -d threadsdl.io -d www.threadsdl.io

# --- HTTP -> HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name threadsdl.io www.threadsdl.io;
    return 301 https://threadsdl.io$request_uri;
}

# --- www -> apex: one canonical host for search engines ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.threadsdl.io;

    ssl_certificate /etc/letsencrypt/live/threadsdl.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/threadsdl.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://threadsdl.io$request_uri;
}

# --- the site ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name threadsdl.io;

    ssl_certificate /etc/letsencrypt/live/threadsdl.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/threadsdl.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/threadsdl.access.log;
    error_log /var/log/nginx/threadsdl.error.log warn;

    # Next.js already sets CSP, X-Frame-Options, nosniff and Referrer-Policy.
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 64k;
    client_body_timeout 10s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Overwrite (never append to) the forwarding headers: the app rate-limits on
    # X-Real-IP, and a client-supplied X-Forwarded-For must not reach it.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;

    # Fetching a Threads post.
    location = /api/resolve/ {
        limit_req zone=threadsdl_resolve burst=10 nodelay;
        limit_req_status 429;
        proxy_read_timeout 30s;
        proxy_pass http://127.0.0.1:3150;
    }

    # Media downloads stream through the app: no buffering, longer timeout.
    location = /api/download/ {
        limit_req zone=threadsdl_general burst=20 nodelay;
        limit_req_status 429;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://127.0.0.1:3150;
    }

    location = /api/admin/login/ {
        limit_req zone=threadsdl_login burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3150;
    }

    location /admin {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        proxy_pass http://127.0.0.1:3150;
    }

    location / {
        limit_req zone=threadsdl_general burst=40 nodelay;
        limit_req_status 429;
        proxy_read_timeout 30s;
        proxy_pass http://127.0.0.1:3150;
    }
}
