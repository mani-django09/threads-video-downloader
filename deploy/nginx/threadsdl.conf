# Reverse proxy + TLS termination for threadsdl.io.
# Mounted into the nginx container by docker-compose.yml (conf.d/default.conf),
# so it is included inside the http {} block.

server_tokens off;

# Per-IP request limits (a second layer on top of the app's own limiter).
limit_req_zone $binary_remote_addr zone=resolve:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=adminlogin:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
limit_req_status 429;

upstream app_upstream {
    server app:3000;
    keepalive 16;
}

# --- HTTP: ACME challenge + redirect everything else to HTTPS ---
server {
    listen 80;
    server_name threadsdl.io www.threadsdl.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 301 https://threadsdl.io$request_uri;
    }
}

# --- HTTPS: www -> apex (one canonical host for SEO) ---
server {
    listen 443 ssl;
    http2 on;
    server_name www.threadsdl.io;

    ssl_certificate     /etc/letsencrypt/live/threadsdl.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/threadsdl.io/privkey.pem;

    return 301 https://threadsdl.io$request_uri;
}

# --- HTTPS: the site ---
server {
    listen 443 ssl;
    http2 on;
    server_name threadsdl.io;

    ssl_certificate     /etc/letsencrypt/live/threadsdl.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/threadsdl.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Next.js already sets CSP, X-Frame-Options, nosniff and Referrer-Policy;
    # only HSTS is added here so headers are not duplicated.
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 64k;   # the API only ever receives a short JSON body
    client_body_timeout 10s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;

    # Always overwrite (never append to) the forwarding headers: the app
    # rate-limits on X-Real-IP, and a client-supplied X-Forwarded-For must not
    # reach it.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    # Fetching a Threads post.
    location = /api/resolve/ {
        limit_req zone=resolve burst=10 nodelay;
        proxy_read_timeout 30s;
        proxy_pass http://app_upstream;
    }

    # Media downloads stream through the app: no buffering, longer timeout.
    location = /api/download/ {
        limit_req zone=general burst=20 nodelay;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://app_upstream;
    }

    location = /api/admin/login/ {
        limit_req zone=adminlogin burst=3 nodelay;
        proxy_pass http://app_upstream;
    }

    location /admin {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://app_upstream;
    }

    location / {
        limit_req zone=general burst=40 nodelay;
        proxy_read_timeout 30s;
        proxy_pass http://app_upstream;
    }
}
